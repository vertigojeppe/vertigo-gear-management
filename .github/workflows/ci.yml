name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql://vertigo:vertigo@localhost:5432/vertigo_gear
  AUTH_SECRET: ci-only-secret-not-for-production
  APP_URL: http://localhost:3000
  SEED_PASSWORD: vertigo123
  # The browser tests sign in as the seeded admin; 2FA is tested on its own (e2e/two-factor.spec.ts).
  TWO_FACTOR_REQUIRED_ROLES: none
  # Reservations, rent-in and quotes on projects are hidden by default (src/lib/features.ts); the browser tests still cover them.
  PROJECT_GEAR: "on"
  # CI has no GPU: skip onnxruntime's CUDA download (photo backgrounds fall back to the plain cutout).
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertigo
          POSTGRES_PASSWORD: vertigo
          POSTGRES_DB: vertigo_gear
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vertigo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client and migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # The backup round-trip replaces the whole database, so it runs alone, after the parallel suite.
      - run: npm run test:backup
        env:
          BACKUP_RESTORE_TEST: "1"

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
