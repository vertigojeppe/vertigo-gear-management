services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vertigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertigo}
      POSTGRES_DB: ${POSTGRES_DB:-vertigo_gear}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vertigo} -d ${POSTGRES_DB:-vertigo_gear}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vertigo}:${POSTGRES_PASSWORD:-vertigo}@db:5432/${POSTGRES_DB:-vertigo_gear}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    profiles: ["prod"]

volumes:
  db-data:
  uploads:
